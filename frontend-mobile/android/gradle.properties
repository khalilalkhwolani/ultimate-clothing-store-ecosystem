# 1. إعدادات الذاكرة وتوجيه الشبكة (حل مشكلة getsockopt)
# تم تقليل الذاكرة لضمان الاستقرار وإجبار الجافا على IPv4
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true

# 2. زيادة وقت الانتظار للتحميل (حل مشكلة SocketTimeout)
# القيمة بالملي ثانية (300000 تعني 5 دقائق) لضمان عدم قطع التحميل
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000

# 3. دعم مكتبات أندرويد الحديثة
android.useAndroidX=true
android.enableJetifier=true

# 4. تصفير إعدادات البروكسي (لضمان عدم تدخل VMware أو برامج قديمة)
# هذه الأسطر تضمن أن Gradle سيتصل بالإنترنت مباشرة دون وسيط
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=